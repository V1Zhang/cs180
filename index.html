<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My CS180 Portfolio</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f7f9fb;
            margin: 0;
            padding: 40px;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 40px;
        }

        .projects {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .project {
            width: 60%;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            padding: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .project:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.15);
        }

        .project a {
            text-decoration: none;
            color: #007acc;
            font-weight: bold;
            font-size: 20px;
        }

        .project a:hover {
            color: #005fa3;
        }

        .project span {
            display: block;
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>Welcome to My CS180 Portfolio!</h1>
    <div class="projects">
        <div class="project">
            <a href="./0/index.html">Project 0</a>
            <span>Introduction and Image Alignment</span>
        </div>
        <div class="project">
            <a href="./1/index.html">Project 1</a>
            <span>Feature Detection and Matching</span>
        </div>
        <div class="project">

            <span>Image Stitching and Mosaics</span>
        </div>
        <div class="project">
            <a href="./3/index.html">Project 3</a>
            <span>Photometric Stereo and Relighting</span>
        </div>
        <div class="project">
            <a href="./4/index.html">Project 4</a>
            <span>Neural Radiance Field (NeRF)</span>
        </div>
    </div>
